name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements-ci.txt
      - run: ruff check campster tests
      - run: ruff format --check campster/application.py campster/camp.py campster/equipment.py campster/scenario.py campster/web.py tests
      - run: python -m compileall -q campster kochat tests
      - run: node --check campster/static/js/main.js
      - run: pytest -q
