<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="지역, 테마, 장비를 추천하는 캠핑 챗봇 CAMPSTER">
    <title>CAMPSTER | 캠핑 추천 챗봇</title>

    <link href="../static/css/main.css?v=20260801" rel="stylesheet">
    <link href="../static/css/chat-modern.css?v=20260801" rel="stylesheet">
</head>

<body>
<main class="chat_window app_frame app_page chat_app" aria-label="CAMPSTER 챗봇">
    <campster-header action="reset"></campster-header>

    <ul class="messages" aria-live="polite" aria-label="대화 내용"></ul>

    <section class="bottom_wrapper" aria-label="메시지 입력">
        <div class="quick_prompts" id="quick-prompts" aria-label="추천 질문" hidden>
            <button type="button" data-message="서울 근교 캠핑장을 추천해줘">서울 근교</button>
            <button type="button" data-message="별이 잘 보이는 조용한 캠핑장">별 보기 좋은 곳</button>
            <button type="button" data-message="초보자용 텐트를 추천해줘">입문용 텐트</button>
        </div>
        <div class="composer">
            <label class="sr_only" for="message-input">메시지</label>
            <div class="message_input_wrapper">
                <input
                    id="message-input"
                    class="message_input"
                    type="text"
                    autocomplete="off"
                    placeholder="사용할 닉네임을 입력해주세요"
                >
            </div>
            <button class="send_message" id="send_message" type="button" aria-label="메시지 전송">
                <span class="send_icon" aria-hidden="true">➤</span>
            </button>
        </div>

        <campster-navigation active="chat"></campster-navigation>
    </section>
</main>

<div class="message_template" aria-hidden="true">
    <li class="message">
        <div class="avatar" aria-hidden="true"></div>
        <div class="text_wrapper">
            <div class="text"></div>
        </div>
    </li>
</div>

<script src="../static/js/components.js?v=20260731"></script>
<script src="../static/js/main.js?v=20260731"></script>
</body>
</html>
