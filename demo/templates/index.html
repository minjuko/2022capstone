<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="지역, 테마, 장비를 추천하는 캠핑 챗봇 CAMPSTER">
    <title>CAMPSTER | 캠핑 추천 챗봇</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="../static/css/bootstrap.css" rel="stylesheet">
    <link href="../static/css/main.css" rel="stylesheet">
</head>

<body>
<main class="chat_window" aria-label="CAMPSTER 챗봇">
    <header class="top_menu">
        <div>
            <h1 class="title">CAMPSTER</h1>
            <p class="subtitle">나에게 맞는 캠핑을 찾아보세요</p>
        </div>
        <span class="demo_badge" title="백엔드 서버 없이 프론트엔드 화면을 확인하는 모드">FRONTEND DEMO</span>
    </header>

    <ul class="messages" aria-live="polite" aria-label="대화 내용"></ul>

    <section class="bottom_wrapper" aria-label="메시지 입력">
        <div class="composer">
            <label class="sr_only" for="message-input">메시지</label>
            <div class="message_input_wrapper">
                <input
                    id="message-input"
                    class="message_input"
                    type="text"
                    autocomplete="off"
                    onkeyup="return onClickAsEnter(event)"
                    placeholder="메시지를 입력하세요"
                >
            </div>
            <button class="send_message" id="send_message" type="button" onclick="onSendButtonClicked()" aria-label="메시지 전송">
                <span class="send_icon" aria-hidden="true">➤</span>
            </button>
        </div>

        <nav class="tab" aria-label="주요 화면">
            <ul class="tabnav">
                <li><a href="home.html" aria-label="홈">⌂<span>홈</span></a></li>
                <li><a href="index.html" class="active" aria-current="page" aria-label="챗봇">●<span>챗봇</span></a></li>
                <li><a href="community.html" aria-label="커뮤니티">♧<span>커뮤니티</span></a></li>
            </ul>
        </nav>
    </section>
</main>

<div class="message_template" aria-hidden="true">
    <li class="message">
        <div class="avatar" aria-hidden="true"></div>
        <div class="text_wrapper">
            <div class="text"></div>
        </div>
    </li>
</div>

<script src="../static/js/jquery.js"></script>
<script src="../static/js/bootstrap.js"></script>
<script src="../static/js/main.js"></script>
<script>
    $(function () {
        greet();
        document.getElementById('message-input').focus();
    });
</script>
</body>
</html>
