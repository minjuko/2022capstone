<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="캠핑 추천 서비스 CAMPSTER">
    <title>CAMPSTER | 홈</title>
    <link href="../static/css/main.css?v=20260801" rel="stylesheet">
    <link href="../static/css/chat-modern.css?v=20260801" rel="stylesheet">
</head>
<body>
<main class="chat_window app_frame content_page home_app" aria-label="CAMPSTER 홈">
    <campster-header></campster-header>

    <section class="home_content">
        <article class="home_hero">
            <div class="hero_copy">
                <span class="hero_eyebrow">AI CAMPING GUIDE</span>
                <h2>내 취향에 맞는<br>캠핑을 찾아보세요</h2>
                <p>지역과 분위기, 필요한 장비를 알려주면 캠스터가 함께 골라드려요.</p>
                <a class="hero_cta" href="index.html">
                    챗봇과 추천 시작하기
                    <span aria-hidden="true">→</span>
                </a>
            </div>
            <div class="hero_mascot" aria-hidden="true">
                <span class="hero_glow"></span>
                <img src="../static/image/campme2.png" alt="">
            </div>
        </article>

        <div class="home_section_heading">
            <div>
                <span>CAMPSTER FEATURES</span>
                <h2>캠스터가 도와드려요</h2>
            </div>
        </div>

        <div class="quick_start_grid" aria-label="챗봇 지원 기능">
            <article class="quick_start_card forest">
                <span class="quick_card_icon" aria-hidden="true">⌖</span>
                <strong>지역으로 찾기</strong>
                <small>원하는 지역과 이동 범위로 캠핑장을 찾아요.</small>
            </article>
            <article class="quick_start_card sunset">
                <span class="quick_card_icon" aria-hidden="true">✦</span>
                <strong>취향으로 찾기</strong>
                <small>바다, 별, 반려동물 등 취향을 반영해요.</small>
            </article>
            <article class="quick_start_card gear">
                <span class="quick_card_icon" aria-hidden="true">◇</span>
                <strong>장비 알아보기</strong>
                <small>처음 준비할 장비의 선택 기준을 알려드려요.</small>
            </article>
        </div>

        <aside class="demo_status">
            <span class="status_symbol"><span></span></span>
            <div>
                <strong>로컬 데모가 준비됐어요</strong>
                <p>API 키가 없어도 예시 추천을 체험할 수 있습니다.</p>
            </div>
            <span class="status_chevron" aria-hidden="true">✓</span>
        </aside>
    </section>

    <campster-navigation active="home"></campster-navigation>
</main>
<script src="../static/js/components.js?v=20260731"></script>
</body>
</html>
